<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AESSA Virtual 3D</title><style>body{margin:0;overflow:hidden;font-family:Arial;background:#e8f0f5}#info{position:absolute;top:12px;left:12px;background:#ffffffdd;padding:12px 16px;border-radius:10px;max-width:340px;line-height:1.5}#info small{color:#475569}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;color:#2563eb;font-size:22px}#move{position:absolute;bottom:18px;left:18px;background:#fff9;border-radius:8px;padding:10px;font-size:13px}</style></head><body><div id="info"><b>AESSA Virtual 3D — Protótipo</b><br><small>Corredor central, quatro salas e secretária de atendimento. No computador: clique para olhar, WASD para andar. No Quest 3: abra por HTTPS e escolha «Enter VR».</small></div><div id="cross">+</div><div id="move">W A S D · rato para olhar · ESC para libertar</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';
import {VRButton} from 'https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/webxr/VRButton.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcfe6f5);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.08,150);camera.position.set(0,1.65,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);document.body.appendChild(VRButton.createButton(renderer));scene.add(new THREE.HemisphereLight(0xffffff,0x8296a8,2));const sun=new THREE.DirectionalLight(0xffffff,1.8);sun.position.set(7,14,6);scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});const wall=mat(0xf4f5ef),floor=mat(0xbccbd0),roomfloor=mat(0xe6d8bd),wood=mat(0x996a40),dark=mat(0x36475b),blue=mat(0x5484ab),glass=new THREE.MeshStandardMaterial({color:0x90c9e9,transparent:true,opacity:.35,side:THREE.DoubleSide});
function box(x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}function text(s,x,y,z,rot=0,size=.28){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,512,128);ctx.fillStyle='#17324d';ctx.font='bold 52px Arial';ctx.textAlign='center';ctx.fillText(s,256,83);const t=new THREE.CanvasTexture(c);const p=new THREE.Mesh(new THREE.PlaneGeometry(size*4,size),new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide}));p.position.set(x,y,z);p.rotation.y=rot;scene.add(p)}
// Corredor: 3m de largura, 16m de comprimento. Salas: 7x6m, duas de cada lado.
box(0,-.12,0,17,.24,16,floor);box(0,-.095,0,3,.05,16,mat(0x90aab7));for(const side of [-1,1]){for(const zz of [-4,4])box(side*5,-.08,zz,7,.06,8,roomfloor);box(side*8.5,1.55,0,.16,3.1,16,wall);box(side*5,1.55,-8,7,.16,3.1,wall);box(side*5,1.55,8,7,.16,3.1,wall);box(side*5,1.55,0,7,.16,3.1,wall);
// Parede junto ao corredor, com portas de 1.2m em cada sala
for(const z of [-4,4]){const a=z-4,b=z+4,door=z;box(side*1.5,1.55,(a+door-.6)/2,.16,3.1,door-.6-a,wall);box(side*1.5,1.55,(door+.6+b)/2,.16,3.1,b-door-.6,wall);box(side*1.5,2.7,door,.16,.8,1.2,wall);box(side*1.5,1.1,door-.64,.18,2.2,.08,wood);text(`Sala ${side<0?(z<0?'1':'2'):(z<0?'3':'4')}`,side*1.38,2.35,door+1.35,side<0?Math.PI/2:-Math.PI/2,.23);
// Quadros e mesas
box(side*7.9,1.55,z, .08,1.2,2.6,dark);for(const xx of [3.2,5.3,7])for(const dz of [-2,0,2]){box(side*xx,.75,z+dz,.9,.08,.65,wood);for(const dx of [-.34,.34])for(const dzz of [-.23,.23])box(side*(xx+dx),.38,z+dz+dzz,.055,.7,.055,dark)}}}
// Secretária central de atendimento
box(0,.78,0,1.25,.12,1.5,wood);for(const x of [-.5,.5])for(const z of [-.62,.62])box(x,.38,z,.07,.7,.07,dark);box(0,1.02,-.12,.62,.4,.05,dark);box(0,.82,-.33,.65,.04,.28,mat(0x343b44));box(0,.55,1.05,.55,.1,.55,blue);box(0,.29,1.05,.08,.5,.08,dark);text('Atendimento',0,2.4,0,0,.3);
// Entrada e fim do corredor
box(-.9,1.55,8,.16,3.1,.15,wall);box(.9,1.55,8,.16,3.1,.15,wall);text('AESSA VIRTUAL',0,2.6,7.7,Math.PI,.35);
// Marcadores de orientação no chão
for(let z=-6;z<7;z+=2)box(0,-.055,z,.12,.012,.55,blue);
const clock=new THREE.Clock();const keys={};let yaw=0,pitch=0,locked=false;renderer.domElement.addEventListener('click',()=>{if(!renderer.xr.isPresenting)renderer.domElement.requestPointerLock()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);document.addEventListener('mousemove',e=>{if(locked){yaw-=e.movementX*.0025;pitch=Math.max(-1.3,Math.min(1.3,pitch-e.movementY*.0025));camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0)}});document.addEventListener('keydown',e=>keys[e.code]=true);document.addEventListener('keyup',e=>keys[e.code]=false);
const controller1=renderer.xr.getController(0),controller2=renderer.xr.getController(1);scene.add(controller1,controller2);const move=new THREE.Vector3();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(!renderer.xr.isPresenting){move.set((keys.KeyD?1:0)-(keys.KeyA?1:0),0,(keys.KeyS?1:0)-(keys.KeyW?1:0));if(move.lengthSq()){move.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.addScaledVector(move,dt*3);camera.position.x=Math.max(-8,Math.min(8,camera.position.x));camera.position.z=Math.max(-7.7,Math.min(7.7,camera.position.z))}}renderer.render(scene,camera)});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
